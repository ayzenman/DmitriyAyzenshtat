<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Страница не найдена — Дмитрий Айзенштат</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #1a1f2e; color: #f5f5f5;
      font-family: Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    .code { font-family: 'Playfair Display', Georgia, serif; font-size: 72px; color: #d4a853; margin: 0; line-height: 1; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 28px; margin: 20px 0 12px; }
    p { color: #b0b8c8; margin: 0 0 32px; line-height: 1.6; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 12px 22px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 15px; }
    .primary { background: #d4a853; color: #1a1f2e; }
    .secondary { border: 1px solid #d4a853; color: #d4a853; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.</p>
    <div class="links">
      <a class="primary" href="/">На главную</a>
      <a class="secondary" href="/library/">Библиотека для собственника</a>
    </div>
  </main>
</body>
</html>
