name: Deploy

# Запускать при пушах в ветку main (измените на вашу основную ветку, если нужно)
on:
  push:
    branches: [ main ]
  # Ручной запуск из вкладки Actions (кнопка «Run workflow»)
  workflow_dispatch:

# Не запускать две выкладки одновременно: следующая ждёт, пока закончится предыдущая.
# Иначе две выкладки накладываются друг на друга, и часть файлов может пропасть.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Собираем папку для выкладки: главная + всё из public (библиотека, стили, скрипты, иконки).
      #    Сайт статичный, поэтому сборка не нужна — файлы просто копируются.
      - name: Prepare site
        run: |
          rm -rf dist
          mkdir dist
          cp -r public/. dist/
          cp index.html dist/

      # 3. Создаём secrets.php из GitHub Secret и кладём в dist.
      #    Токен берётся из защищённого хранилища GitHub (Settings → Secrets),
      #    в коде репозитория его нет. Файл попадает на сервер вместе со сборкой.
      - name: Create secrets.php for MAX
        run: |
          cat > ./dist/secrets.php << 'PHP'
          <?php
          return [
            'bot_token' => '${{ secrets.MAX_BOT_TOKEN }}',
            'chat_id' => 345527149,
          ];
          PHP

      # 4. Загружаем файлы на хостинг по FTP.
      #    Загружаются только изменённые файлы, удалённые из репозитория — удаляются с сервера.
      #    Полной очистки папки больше нет: сайт не пропадает на время выкладки.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Укажите точный путь к корневой папке вашего сайта на хостинге
          server-dir: public_html/
